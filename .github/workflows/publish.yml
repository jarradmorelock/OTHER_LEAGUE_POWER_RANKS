name: Other League Power Rankings

on:
  schedule:
    - cron: '0 15 * * 6'
  workflow_dispatch:
    inputs:
      league:
        description: League to build (or all six)
        required: true
        default: all
        type: choice
        options:
          - all
          - broken_hearts
          - rocky_top_rumble
          - nine_to_five
          - best_characters
          - sec
          - dont_tell_my_wife
      publish:
        description: Actually post to Discord (otherwise save a dry-run preview)
        required: true
        default: false
        type: boolean
      force:
        description: Republish even if this league/week was already posted
        required: true
        default: false
        type: boolean
      week:
        description: Optional Sleeper/NFL week override
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: other-league-power-ranks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BROKEN_HEARTS_WEEKLY_WEBHOOK: ${{ secrets.BROKEN_HEARTS_WEEKLY_WEBHOOK }}
      ROCKY_TOP_RUMBLE_WEEKLY_WEBHOOK: ${{ secrets.ROCKY_TOP_RUMBLE_WEEKLY_WEBHOOK }}
      NINE_TO_FIVE_WEEKLY_WEBHOOK: ${{ secrets.NINE_TO_FIVE_WEEKLY_WEBHOOK }}
      BEST_CHARACTERS_WEEKLY_WEBHOOK: ${{ secrets.BEST_CHARACTERS_WEEKLY_WEBHOOK }}
      SEC_WEEKLY_WEBHOOK: ${{ secrets.SEC_WEEKLY_WEBHOOK }}
      DONT_TELL_MY_WIFE_WEEKLY_WEBHOOK: ${{ secrets.DONT_TELL_MY_WIFE_WEEKLY_WEBHOOK }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Build selected league reports
        env:
          EVENT_NAME: ${{ github.event_name }}
          LEAGUE: ${{ inputs.league || 'all' }}
          PUBLISH: ${{ inputs.publish || false }}
          FORCE: ${{ inputs.force || false }}
          WEEK: ${{ inputs.week || '' }}
        run: |
          args=(--league "$LEAGUE")
          if [[ "$EVENT_NAME" == "schedule" || "$PUBLISH" == "true" ]]; then
            args+=(--publish)
          else
            args+=(--dry-run)
          fi
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          if [[ -n "$WEEK" ]]; then args+=(--week "$WEEK"); fi
          python -m other_league_rankings "${args[@]}"
      - name: Upload generated previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: other-league-power-ranks-${{ github.run_number }}
          path: exports/
          if-no-files-found: ignore
          retention-days: 21
      - name: Save successful movement history
        if: always() && !cancelled() && (github.event_name == 'schedule' || inputs.publish == true)
        run: |
          if [[ -d state ]]; then git add -A -- state/; fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update weekly power-rank history"
            git push
          fi
