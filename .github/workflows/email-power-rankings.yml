name: Tuesday Other League Power Rankings Email

on:
  workflow_dispatch:
    inputs:
      league:
        description: League to email (or all six)
        required: true
        default: all
        type: choice
        options: [all, broken_hearts, rocky_top_rumble, nine_to_five, best_characters, sec, dont_tell_my_wife]
      send_email:
        description: Send the real email (otherwise preview only)
        type: boolean
        default: false
  schedule:
    - cron: '7 15 * * 2'
    - cron: '7 16 * * 2'

permissions:
  contents: write

concurrency:
  group: other-league-tuesday-email
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Run scheduled timezone guard
        id: clock
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          if os.environ["EVENT"] != "schedule":
              print("run=true")
          else:
              trigger = os.environ["SCHEDULE"]
              now = datetime.now(ZoneInfo("America/New_York"))
              expected = "7 15 * * 2" if now.utcoffset().total_seconds() == -4*3600 else "7 16 * * 2"
              print(f"run={str(trigger == expected).lower()}")
          PY
      - name: Build/email all six leagues
        if: ${{ steps.clock.outputs.run == 'true' }}
        env:
          PUBLICATIONS_EMAIL_FROM: ${{ secrets.PUBLICATIONS_EMAIL_FROM }}
          PUBLICATIONS_EMAIL_TO: ${{ secrets.PUBLICATIONS_EMAIL_TO }}
          PUBLICATIONS_EMAIL_APP_PASSWORD: ${{ secrets.PUBLICATIONS_EMAIL_APP_PASSWORD }}
          SEND_REAL_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email == true }}
          TARGET_LEAGUE: ${{ inputs.league || 'all' }}
        run: |
          if [[ "$SEND_REAL_EMAIL" == "true" ]]; then
            python -m other_league_rankings --league "$TARGET_LEAGUE" --email
          else
            python -m other_league_rankings --league "$TARGET_LEAGUE" --dry-run
          fi
      - name: Upload publication package
        if: ${{ always() && steps.clock.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: other-league-tuesday-${{ github.run_number }}
          path: |
            exports/
            handoff/
          if-no-files-found: warn
      - name: Save official handoffs and Tuesday movement baseline
        if: ${{ success() && steps.clock.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.send_email == true) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add handoff state
          if ! git diff --cached --quiet; then
            git commit -m "Save Tuesday other-league editorial ranking handoffs"
            git push origin HEAD:main
          fi
