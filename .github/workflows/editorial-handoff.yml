name: Refresh Editorial Desk Ranking Handoffs

on:
  workflow_dispatch:
    inputs:
      league:
        description: League to refresh
        type: choice
        default: all
        options: [all, broken_hearts, rocky_top_rumble, nine_to_five, best_characters, sec, dont_tell_my_wife]
  schedule:
    - cron: "7 15 * * 2"
    - cron: "7 16 * * 2"

permissions:
  contents: write

concurrency:
  group: other-league-rankings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Schedule guard
        id: clock
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          if os.environ["EVENT"] != "schedule":
              print("run=true")
          else:
              current = datetime.now(ZoneInfo("America/New_York"))
              intended = "7 15 * * 2" if current.utcoffset().total_seconds() == -4*3600 else "7 16 * * 2"
              print(f"run={str(os.environ['SCHEDULE'] == intended).lower()}")
          PY
      - name: Generate machine-readable Editorial Desk handoffs
        if: ${{ steps.clock.outputs.run == 'true' }}
        env:
          TARGET_LEAGUE: ${{ inputs.league || 'all' }}
        run: python -m other_league_rankings --league "$TARGET_LEAGUE" --handoff
      - name: Upload ranking research artifacts
        if: ${{ steps.clock.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: editorial-rankings-${{ github.run_number }}
          path: |
            handoff/
            exports/
          if-no-files-found: warn
      - name: Commit authoritative input feed
        if: ${{ success() && steps.clock.outputs.run == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add -A -- handoff/ state/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh authoritative Editorial Desk ranking handoffs"
            git push origin HEAD:main
          fi
